<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Variedades EVE J Sant Louis - POS Nube</title>
    <link rel="icon" type="image/png" href="logo.png">
    <!-- Librería de Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');

        :root {
            --bg-dark: #121212;
            --card-dark: #1a1a1a;
            --border-dark: #2a1a33;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --primary-purple: #9333ea;
            --primary-purple-hover: #7e22ce;
            --soft-purple-bg: rgba(147, 51, 234, 0.1);
        }

        body.light-theme {
            --bg-dark: #f4f6f9;
            --card-dark: #ffffff;
            --border-dark: #e5e7eb;
            --text-main: #111827;
            --text-muted: #4b5563;
            --soft-purple-bg: rgba(147, 51, 234, 0.15);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            display: flex;
            height: 100vh;
            overflow: hidden;
            transition: background-color 0.3s, color 0.3s;
        }

        #loginOverlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: var(--bg-dark);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }

        .login-box {
            background-color: var(--card-dark);
            border: 1px solid var(--border-dark);
            padding: 30px;
            border-radius: 12px;
            width: 350px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .login-box h2 {
            color: var(--primary-purple);
            margin-bottom: 20px;
            font-size: 1.3rem;
        }

        .sidebar {
            width: 260px;
            background-color: var(--card-dark);
            border-right: 1px solid var(--border-dark);
            display: flex;
            flex-direction: column;
            padding: 20px;
            overflow-y: auto;
            transition: transform 0.3s ease;
        }

        .sidebar h2 {
            font-size: 1rem;
            margin-bottom: 30px;
            color: var(--primary-purple);
        }

        .menu-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            text-align: left;
            padding: 12px 15px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.95rem;
            margin-bottom: 8px;
            transition: 0.2s;
        }

        .menu-btn.active, .menu-btn:hover {
            background-color: var(--soft-purple-bg);
            color: var(--primary-purple);
        }

        .main-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        .topbar-mobile {
            display: none;
            background-color: var(--card-dark);
            border-bottom: 1px solid var(--border-dark);
            padding: 10px 15px;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
        }

        .section-view {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: none;
            background-color: var(--bg-dark);
            overflow-y: auto;
            padding: 20px;
        }

        .section-view.active-view {
            display: flex;
        }

        #viewPos.active-view {
            display: flex;
        }

        .catalog-section {
            flex: 2;
            padding-right: 20px;
            overflow-y: auto;
            border-right: 1px solid var(--border-dark);
            display: flex;
            flex-direction: column;
        }

        .checkout-section {
            flex: 1.3;
            background-color: var(--card-dark);
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow-y: auto;
            margin-left: 20px;
            border-radius: 12px;
            border: 1px solid var(--border-dark);
        }

        h3 {
            margin-bottom: 15px;
            font-size: 1.1rem;
            color: var(--text-main);
        }

        .search-container {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            align-items: center;
        }

        .search-box {
            width: 100%;
            padding: 12px 15px;
            background-color: var(--card-dark);
            border: 1px solid var(--border-dark);
            color: var(--text-main);
            border-radius: 8px;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
            margin-bottom: 0 !important;
        }

        .search-box:focus {
            border-color: var(--primary-purple);
        }

        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 15px;
            overflow-y: auto;
            flex: 1;
        }

        .product-card {
            background-color: var(--card-dark);
            border: 1px solid var(--border-dark);
            border-radius: 10px;
            padding: 12px;
            cursor: pointer;
            transition: 0.2s;
            height: fit-content;
        }

        .product-card:hover {
            border-color: var(--primary-purple);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(147, 51, 234, 0.15);
        }

        .product-card h4 {
            font-size: 0.95rem;
            margin-bottom: 4px;
            color: var(--text-main);
        }

        .product-card p {
            color: var(--primary-purple);
            font-weight: 600;
            font-size: 0.9rem;
        }

        .product-card span {
            font-size: 0.75rem;
            color: var(--text-muted);
            display: block;
        }

        .badge-dept {
            font-size: 0.7rem !important;
            color: var(--primary-purple) !important;
            background: rgba(147,51,234,0.15);
            padding: 2px 6px;
            border-radius: 4px;
            display: inline-block !important;
            margin-bottom: 4px;
            font-weight: 600;
        }

        .cart-items {
            flex: 1;
            overflow-y: auto;
            margin-bottom: 10px;
            max-height: 150px;
            min-height: 80px;
            border-bottom: 1px solid var(--border-dark);
            padding-bottom: 5px;
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 0;
            border-bottom: 1px solid var(--border-dark);
            font-size: 0.85rem;
        }

        .cart-controls {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .qty-btn {
            background: var(--bg-dark);
            color: var(--text-main);
            border: 1px solid var(--border-dark);
            width: 24px;
            height: 24px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.85rem;
        }

        .qty-btn:hover {
            border-color: var(--primary-purple);
            color: var(--primary-purple);
        }

        .qty-input {
            width: 35px !important;
            padding: 2px !important;
            text-align: center;
            margin: 0 !important;
            font-size: 0.8rem !important;
        }

        .btn-remove-item {
            background: rgba(147, 51, 234, 0.2);
            color: #9333ea;
            border: none;
            padding: 2px 6px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            margin-left: 4px;
            transition: 0.2s;
        }

        .btn-remove-item:hover {
            background: #9333ea;
            color: #fff;
        }

        .payment-methods {
            margin-bottom: 8px;
        }

        .payment-methods label {
            display: block;
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 2px;
        }

        select, input {
            width: 100%;
            padding: 8px;
            background-color: var(--bg-dark);
            border: 1px solid var(--border-dark);
            color: var(--text-main);
            border-radius: 8px;
            margin-bottom: 6px;
            font-size: 0.88rem;
            outline: none;
            transition: border-color 0.2s;
        }

        select:focus, input:focus {
            border-color: var(--primary-purple);
        }

        .totals {
            border-top: 1px solid var(--border-dark);
            padding-top: 6px;
            margin-bottom: 8px;
            font-size: 0.82rem;
        }

        .total-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 2px;
        }

        .total-row.final {
            font-size: 1rem;
            font-weight: 700;
            color: var(--primary-purple);
        }

        .btn-action {
            background-color: var(--primary-purple);
            color: white;
            border: none;
            padding: 10px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: 0.2s;
        }

        .btn-action:hover {
            background-color: var(--primary-purple-hover);
        }

        .panel-box {
            background-color: var(--card-dark);
            border: 1px solid var(--border-dark);
            padding: 25px;
            border-radius: 12px;
            max-width: 980px;
            margin-bottom: 20px;
        }

        .panel-box h3 {
            color: var(--primary-purple);
            margin-bottom: 15px;
        }

        .methods-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 10px;
            margin-bottom: 20px;
        }

        .method-card {
            background: var(--bg-dark);
            border: 1px solid var(--border-dark);
            padding: 10px;
            border-radius: 8px;
            text-align: center;
        }

        .method-card h5 {
            font-size: 0.78rem;
            color: var(--text-muted);
            margin-bottom: 4px;
        }

        .method-card p {
            font-size: 0.95rem;
            font-weight: 700;
            color: var(--primary-purple);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            font-size: 0.88rem;
        }

        th, td {
            padding: 8px;
