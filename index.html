<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Sistema POS Multinegocio</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Supabase JS Client CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { touch-action: manipulation; }
    .no-select { user-select: none; }
  </style>
</head>
<body class="bg-gray-100 min-h-screen font-sans text-gray-800">

  <!-- PANTALLA DE LOGIN -->
  <div id="login-screen" class="flex items-center justify-center min-h-screen p-4">
    <div class="bg-white p-6 rounded-2xl shadow-xl w-full max-w-sm">
      <h1 class="text-2xl font-bold text-center text-blue-600 mb-6">Acceso al Sistema POS</h1>
      <form id="login-form" onsubmit="event.preventDefault(); handleLogin();" class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-gray-700">Usuario</label>
          <input type="text" id="username" required class="mt-1 block w-full rounded-lg border-gray-300 border p-3 focus:ring-blue-500 focus:border-blue-500 text-lg">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700">Contraseña</label>
          <input type="password" id="password" required class="mt-1 block w-full rounded-lg border-gray-300 border p-3 focus:ring-blue-500 focus:border-blue-500 text-lg">
        </div>
        <button type="submit" class="w-full bg-blue-600 text-white font-bold py-3 rounded-lg text-lg hover:bg-blue-700 transition active:scale-95">
          Ingresar
        </button>
      </form>
    </div>
  </div>

  <!-- PANTALLA PRINCIPAL DEL POS -->
  <div id="pos-screen" class="hidden min-h-screen flex flex-col">
    <!-- BARRA SUPERIOR -->
    <header class="bg-blue-600 text-white p-4 shadow-md flex justify-between items-center">
      <div>
        <h2 id="business-title" class="text-lg font-bold">Negocio</h2>
        <p class="text-xs text-blue-200">Usuario: <span id="user-display">lapatrona</span></p>
      </div>
      <div class="flex items-center space-x-2">
        <select id="business-selector" onchange="switchBusiness()" class="bg-blue-700 text-white text-sm font-semibold rounded-lg p-2 border border-blue-500 focus:outline-none">
          <option value="negocio1">Negocio 1</option>
          <option value="negocio2">Negocio 2</option>
        </select>
        <button onclick="logout()" class="bg-red-500 hover:bg-red-600 px-3 py-2 rounded-lg text-xs font-bold transition">
          Salir
        </button>
      </div>
    </header>

    <!-- NAVEGACIÓN TAB -->
    <div class="flex bg-white border-b border-gray-200">
      <button id="tab-vender" onclick="setTab('vender')" class="flex-1 py-3 text-center font-bold text-blue-600 border-b-2 border-blue-600 text-sm">
        Ventas / POS
      </button>
      <button id="tab-inventario" onclick="setTab('inventario')" class="flex-1 py-3 text-center font-bold text-gray-500 text-sm">
        Inventario
      </button>
      <button id="tab-reportes" onclick="setTab('reportes')" class="flex-1 py-3 text-center font-bold text-gray-500 text-sm">
        Ventas
      </button>
    </div>

    <!-- CONTENIDO PRINCIPAL -->
    <main class="flex-1 p-4 overflow-y-auto">
      
      <!-- SECCIÓN POS / VENTAS -->
      <section id="sec-vender" class="space-y-4">
        <div class="bg-white p-4 rounded-xl shadow">
          <input type="text" id="search-pos" oninput="renderPosProducts()" placeholder="Buscar producto por nombre o código..." class="w-full p-3 border rounded-lg text-lg">
        </div>
        <div id="pos-products-list" class="grid grid-cols-2 gap-3">
          <!-- Lista dinámica de productos -->
        </div>
        
        <!-- CARRITO DE COMPRA -->
        <div class="bg-white p-4 rounded-xl shadow space-y-3 mt-4">
          <h3 class="font-bold text-lg text-gray-700">Carrito Actual</h3>
          <div id="cart-items" class="space-y-2 max-h-40 overflow-y-auto">
            <p class="text-sm text-gray-400 text-center">No hay productos seleccionados.</p>
          </div>
          <div class="border-t pt-2 flex justify-between font-bold text-xl">
            <span>Total:</span>
            <span id="cart-total">$0.00</span>
          </div>
          <button onclick="processSale()" class="w-full bg-green-600 text-white font-bold py-3 rounded-lg text-lg hover:bg-green-700 transition active:scale-95">
            Completar Venta
          </button>
        </div>
      </section>

      <!-- SECCIÓN INVENTARIO -->
      <section id="sec-inventario" class="hidden space-y-4">
        <div class="bg-white p-4 rounded-xl shadow">
          <h3 class="font-bold text-lg mb-3">Agregar / Modificar Producto</h3>
          <form id="product-form" onsubmit="event.preventDefault(); saveProduct();" class="space-y-3">
            <input type="hidden" id="prod-id">
            <input type="text" id="prod-code" placeholder="Código de barra o ID" required class="w-full p-2 border rounded">
            <input type="text" id="prod-name" placeholder="Nombre del producto" required class="w-full p-2 border rounded">
            <div class="grid grid-cols-2 gap-2">
              <input type="number" step="0.01" id="prod-price" placeholder="Precio ($)" required class="p-2 border rounded">
              <input type="number" step="0.01" id="prod-mayor" placeholder="Precio al Mayor ($)" required class="p-2 border rounded">
            </div>
            <div class="grid grid-cols-2 gap-2">
              <input type="number" id="prod-stock" placeholder="Stock / Cantidad" required class="p-2 border rounded">
              <select id="prod-iva" class="p-2 border rounded">
                <option value="0">Sin IVA</option>
                <option value="16">IVA 16%</option>
              </select>
            </div>
            <button type="submit" class="w-full bg-blue-600 text-white font-bold py-2 rounded hover:bg-blue-700">
              Guardar Producto
            </button>
          </form>
        </div>

        <div class="bg-white p-4 rounded-xl shadow overflow-x-auto">
          <h3 class="font-bold text-lg mb-3">Listado de Inventario</h3>
          <table class="w-full text-left text-sm">
            <thead>
              <tr class="border-b bg-gray-50">
                <th class="p-2">Producto</th>
                <th class="p-2">Precio</th>
                <th class="p-2">Stock</th>
                <th class="p-2">Acción</th>
              </tr>
            </thead>
            <tbody id="inventory-table-body">
              <!-- Filas dinámicas -->
            </tbody>
          </table>
        </div>
      </section>

      <!-- SECCIÓN REPORTES -->
      <section id="sec-reportes" class="hidden space-y-4">
        <div class="bg-white p-4 rounded-xl shadow">
          <h3 class="font-bold text-lg mb-3">Historial de Ventas</h3>
          <div id="sales-history" class="space-y-2">
            <!-- Ventas dinámicas -->
          </div>
        </div>
      </section>

    </main>
  </div>

  <script>
    // ==========================================
    // CONFIGURACIÓN DE SUPABASE INTEGRADA
    // ==========================================
    const SUPABASE_URL = 'https://lnearffuodrgvdoxvvmt.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_K5SEfgf3IrKycJoZqayWDA_HlNVHCmq';
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // ESTADO LOCAL DE LA APLICACIÓN
    let currentBusiness = 'negocio1';
    let products = [];
    let sales = [];
    let cart = [];

    // ACCESO / AUTENTICACIÓN
    function handleLogin() {
      const user = document.getElementById('username').value.trim();
      const pass = document.getElementById('password').value.trim();

      if (user === 'lapatrona' && pass === 'saint21') {
        document.getElementById('login-screen').classList.add('hidden');
        document.getElementById('pos-screen').classList.remove('hidden');
        initRealtime();
        loadData();
      } else {
        alert('Usuario o contraseña incorrectos');
      }
    }

    function logout() {
      document.getElementById('pos-screen').classList.add('hidden');
      document.getElementById('login-screen').classList.remove('hidden');
    }

    function switchBusiness() {
      currentBusiness = document.getElementById('business-selector').value;
      document.getElementById('business-title').innerText = currentBusiness === 'negocio1' ? 'Negocio 1' : 'Negocio 2';
      cart = [];
      updateCartDisplay();
      loadData();
    }

    function setTab(tab) {
      ['vender', 'inventario', 'reportes'].forEach(t => {
        document.getElementById(`sec-${t}`).classList.add('hidden');
        document.getElementById(`tab-${t}`).className = "flex-1 py-3 text-center font-bold text-gray-500 text-sm";
      });
      document.getElementById(`sec-${tab}`).classList.remove('hidden');
      document.getElementById(`tab-${tab}`).className = "flex-1 py-3 text-center font-bold text-blue-600 border-b-2 border-blue-600 text-sm";
    }

    // CARGAR DATOS DESDE SUPABASE
    async function loadData() {
      // Cargar Productos
      const { data: prodData } = await supabase
        .from('productos')
        .select('*')
        .eq('business_id', currentBusiness);
      
      products = prodData || [];
      renderPosProducts();
      renderInventoryTable();

      // Cargar Ventas
      const { data: salesData } = await supabase
        .from('ventas')
        .select('*')
        .eq('business_id', currentBusiness)
        .order('fecha', { ascending: false });

      sales = salesData || [];
      renderSalesHistory();
    }

    // CONFIGURAR REALTIME (Sincronización en vivo entre celulares)
    function initRealtime() {
      supabase
        .channel('schema-db-changes')
        .on('postgres_changes', { event: '*', schema: 'public', table: 'productos' }, payload => {
          loadData();
        })
        .on('postgres_changes', { event: '*', schema: 'public', table: 'ventas' }, payload => {
          loadData();
        })
        .subscribe();
    }

    // INVENTARIO
    async function saveProduct() {
      const id = document.getElementById('prod-id').value;
      const code = document.getElementById('prod-code').value;
      const name = document.getElementById('prod-name').value;
      const price = parseFloat(document.getElementById('prod-price').value);
      const mayor_price = parseFloat(document.getElementById('prod-mayor').value);
      const stock = parseInt(document.getElementById('prod-stock').value);
      const iva = parseInt(document.getElementById('prod-iva').value);

      const productPayload = { business_id: currentBusiness, code, name, price, mayor_price, stock, iva };

      if (id) {
        await supabase.from('productos').update(productPayload).eq('id', id);
      } else {
        await supabase.from('productos').insert([productPayload]);
      }

      document.getElementById('product-form').reset();
      document.getElementById('prod-id').value = '';
      loadData();
    }

    function renderInventoryTable() {
      const tbody = document.getElementById('inventory-table-body');
      tbody.innerHTML = '';
      products.forEach(p => {
        tbody.innerHTML += `
          <tr class="border-b">
            <td class="p-2">
              <div class="font-bold">${p.name}</div>
              <div class="text-xs text-gray-400">${p.code}</div>
            </td>
            <td class="p-2">$${p.price.toFixed(2)}</td>
            <td class="p-2">${p.stock}</td>
            <td class="p-2">
              <button onclick="editProduct('${p.id}')" class="text-blue-600 font-bold text-xs">Editar</button>
            </td>
          </tr>
        `;
      });
    }

    function editProduct(id) {
      const p = products.find(prod => prod.id === id);
      if (!p) return;
      document.getElementById('prod-id').value = p.id;
      document.getElementById('prod-code').value = p.code;
      document.getElementById('prod-name').value = p.name;
      document.getElementById('prod-price').value = p.price;
      document.getElementById('prod-mayor').value = p.mayor_price;
      document.getElementById('prod-stock').value = p.stock;
      document.getElementById('prod-iva').value = p.iva;
      setTab('inventario');
    }

    // VENTAS / POS
    function renderPosProducts() {
      const query = document.getElementById('search-pos').value.toLowerCase();
      const container = document.getElementById('pos-products-list');
      container.innerHTML = '';

      const filtered = products.filter(p => p.name.toLowerCase().includes(query) || p.code.toLowerCase().includes(query));

      filtered.forEach(p => {
        container.innerHTML += `
          <div onclick="addToCart('${p.id}')" class="bg-white p-3 rounded-xl shadow cursor-pointer active:scale-95 transition flex flex-col justify-between">
            <div>
              <h4 class="font-bold text-sm">${p.name}</h4>
              <p class="text-xs text-gray-400">Stock: ${p.stock}</p>
            </div>
            <div class="mt-2 text-right font-bold text-blue-600">$${p.price.toFixed(2)}</div>
          </div>
        `;
      });
    }

    function addToCart(id) {
      const p = products.find(prod => prod.id === id);
      if (!p || p.stock <= 0) {
        alert('Producto agotado');
        return;
      }

      const existing = cart.find(item => item.id === id);
      if (existing) {
        if (existing.qty < p.stock) existing.qty++;
        else alert('No hay más stock disponible');
      } else {
        cart.push({ id: p.id, name: p.name, price: p.price, qty: 1 });
      }
      updateCartDisplay();
    }

    function updateCartDisplay() {
      const container = document.getElementById('cart-items');
      container.innerHTML = '';
      let total = 0;

      if (cart.length === 0) {
        container.innerHTML = '<p class="text-sm text-gray-400 text-center">No hay productos seleccionados.</p>';
      } else {
        cart.forEach(item => {
          const itemTotal = item.price * item.qty;
          total += itemTotal;
          container.innerHTML += `
            <div class="flex justify-between items-center text-sm border-b pb-1">
              <div>
                <span class="font-bold">${item.name}</span>
                <span class="text-xs text-gray-500">x${item.qty}</span>
              </div>
              <span class="font-bold">$${itemTotal.toFixed(2)}</span>
            </div>
          `;
        });
      }

      document.getElementById('cart-total').innerText = `$${total.toFixed(2)}`;
    }

    async function processSale() {
      if (cart.length === 0) {
        alert('El carrito está vacío');
        return;
      }

      const total = cart.reduce((acc, item) => acc + (item.price * item.qty), 0);

      const salePayload = {
        business_id: currentBusiness,
        fecha: new Date().toISOString(),
        tipo: 'Ticket',
        numero: 'V-' + Date.now().toString().slice(-6),
        control: 'C-' + Date.now().toString().slice(-4),
        metodo: 'Efectivo/PagoMóvil',
        total: total,
        exento: total,
        base: 0,
        iva: 0,
        items: cart
      };

      // Registrar Venta
      await supabase.from('ventas').insert([salePayload]);

      // Descontar Inventario
      for (const item of cart) {
        const prod = products.find(p => p.id === item.id);
        if (prod) {
          const newStock = prod.stock - item.qty;
          await supabase.from('productos').update({ stock: newStock }).eq('id', item.id);
        }
      }

      cart = [];
      updateCartDisplay();
      alert('¡Venta realizada con éxito!');
      loadData();
    }

    function renderSalesHistory() {
      const container = document.getElementById('sales-history');
      container.innerHTML = '';

      if (sales.length === 0) {
        container.innerHTML = '<p class="text-sm text-gray-400 text-center">No hay ventas registradas.</p>';
        return;
      }

      sales.forEach(s => {
        container.innerHTML += `
          <div class="bg-gray-50 p-3 rounded-lg border text-sm flex justify-between items-center">
            <div>
              <div class="font-bold">${s.numero}</div>
              <div class="text-xs text-gray-400">${new Date(s.fecha).toLocaleString()}</div>
            </div>
            <div class="font-bold text-green-600">$${s.total.toFixed(2)}</div>
          </div>
        `;
      });
    }
  </script>
</body>
</html>
